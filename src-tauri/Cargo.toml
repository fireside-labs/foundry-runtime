[package]
name = "foundry-runtime"
version = "1.0.0"
description = "Foundry Runtime — Local AI inference for the enterprise."
authors = ["Fireside Labs"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
zip = "2"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
